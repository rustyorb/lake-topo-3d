<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Lake Topo 3D">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset="0.55" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#06243a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <!-- land contours (right side) -->
    <g fill="none" stroke="#c9b98f" stroke-opacity="0.22" stroke-width="1.5">
      <path d="M700 340 C760 250 900 250 960 200 C1020 150 1100 170 1200 120"/>
      <path d="M740 340 C800 270 920 270 980 220 C1040 170 1120 190 1200 150"/>
      <path d="M780 340 C840 290 940 290 1000 240 C1060 190 1140 210 1200 180"/>
      <path d="M820 340 C880 310 960 310 1020 260 C1080 210 1160 230 1200 210"/>
      <path d="M1040 340 C1080 300 1140 300 1200 250"/>
      <path d="M1100 340 C1140 320 1170 320 1200 290"/>
    </g>
    <!-- lake with depth contours (left/centre) -->
    <g transform="translate(360 165)">
      <path d="M-300 20 C-280 -70 -160 -110 -60 -100 C40 -90 120 -110 200 -70 C280 -30 300 40 250 80 C200 120 80 110 0 120 C-90 130 -220 120 -270 80 C-310 50 -310 40 -300 20 Z" fill="url(#water)" fill-opacity="0.25" stroke="#0c4a6e" stroke-width="2.5"/>
      <g fill="none" stroke="#bae6fd" stroke-opacity="0.75">
        <path stroke-width="1.2" d="M-250 20 C-235 -50 -140 -85 -55 -76 C30 -68 105 -85 175 -50 C240 -18 255 35 215 65 C175 95 75 88 5 96 C-70 104 -190 96 -230 66 C-262 44 -262 36 -250 20 Z"/>
        <path stroke-width="1" d="M-200 20 C-190 -32 -115 -60 -50 -52 C15 -46 90 -60 150 -30 C200 -6 210 30 180 52 C150 74 70 66 10 72 C-55 78 -160 72 -190 50 C-215 37 -214 31 -200 20 Z"/>
        <path stroke-width="1" d="M-150 22 C-140 -14 -90 -36 -45 -28 C0 -22 70 -34 120 -10 C155 8 160 26 140 40 C120 54 60 46 15 50 C-40 55 -125 50 -145 38 C-160 31 -160 28 -150 22 Z"/>
        <path stroke-width="1.4" d="M-95 24 C-85 2 -55 -12 -25 -6 C5 0 55 -10 90 8 C110 18 110 30 95 36 C80 42 45 32 15 34 C-25 37 -80 36 -92 30 C-100 27 -100 26 -95 24 Z"/>
        <path stroke-width="1.6" d="M-40 26 C-36 16 -18 10 5 14 C28 18 50 14 62 22 C68 27 64 31 55 32 C40 34 20 30 5 31 C-15 32 -36 30 -40 26 Z"/>
      </g>
      <!-- structure markers -->
      <circle cx="10" cy="24" r="6" fill="#3b82f6" stroke="#0b1220" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="-190" cy="-20" r="5" fill="#ef4444" stroke="#0b1220" stroke-width="1.5"/>
      <circle cx="135" cy="-45" r="5" fill="#22c55e" stroke="#0b1220" stroke-width="1.5"/>
      <circle cx="-60" cy="80" r="5" fill="#f59e0b" stroke="#0b1220" stroke-width="1.5"/>
      <!-- waypoint pin -->
      <g transform="translate(60 -30)">
        <path d="M0 -22 C-7 -22 -12 -17 -12 -10 C-12 -1 0 10 0 10 C0 10 12 -1 12 -10 C12 -17 7 -22 0 -22 Z" fill="#facc15" stroke="#0b1220" stroke-width="1.5"/>
        <circle cx="0" cy="-10" r="4" fill="#0b1220"/>
      </g>
      <text x="-150" y="-40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#bae6fd" fill-opacity="0.9" transform="rotate(-12 -150 -40)">20-foot</text><text x="-8" y="6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#bae6fd" fill-opacity="0.9">73-foot</text>
    </g>
    <!-- title block -->
    <g transform="translate(660 108)">
      <text font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#title)" letter-spacing="2">LAKE TOPO 3D</text>
      <text y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#94a3b8">Real bathymetry → structure, waypoints, 3D model, printable STL</text>
      <g transform="translate(0 76)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#67e8f9">
        <rect x="0" y="-16" width="104" height="24" rx="12" fill="#0e7490" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="12" y="1">no API keys</text>
        <rect x="116" y="-16" width="206" height="24" rx="12" fill="#0e7490" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="128" y="1">Indiana DNR sonar + LiDAR</text>
        <rect x="334" y="-16" width="156" height="24" rx="12" fill="#0e7490" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.5"/>
        <text x="346" y="1">multi-material 3MF</text>
      </g>
    </g>
    <!-- north arrow -->
    <g transform="translate(1150 48)" fill="#f87171">
      <polygon points="0,-16 5,0 -5,0"/>
      <polygon points="0,16 5,0 -5,0" fill="#475569"/>
      <text y="-22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">N</text>
    </g>
  </g>
</svg>
